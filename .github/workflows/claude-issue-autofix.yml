name: Claude - autofix de Issue escalado desde el chat

# Pedido explicito de Carlos: al pulsar "Crear issue" en una escalacion desde el chat de WOBI, que
# ademas de quedar registrado para development, se le envie la solicitud a Claude y Claude investigue
# y proponga un arreglo real. A diferencia de claude-max-shadow-autoreview.yml (solo lectura, rota
# archivos al azar cada noche), este workflow SI puede escribir codigo y abrir un Pull Request real —
# decision explicita de Carlos, sin la restriccion de "solo core/utils/" de la autorrevision nocturna,
# porque los bugs reales que se escalan normalmente tocan dinero/Holded/cashflow. La garantia de
# seguridad no cambia: el PR nunca se fusiona solo — src/server.ts recibe la rama via
# /webhook/github-autofix-branch, abre el PR con el token acotado de WOBI y lo muestra en Telegram
# con los mismos botones "Desplegar/Descartar" ya usados por la autorrevision nocturna.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-issue-autofix-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Investigar y proponer un arreglo real
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # La propia etiqueta (agregada siempre por escalacionCallbackHandler.ts al crear el issue desde
    # el chat) es el unico disparador real — evita que este workflow corra sobre cualquier otro issue
    # del repo.
    if: contains(github.event.issue.labels.*.name, 'wobi-auto-fix')
    steps:
      - name: Comprobar configuracion privada
        id: preflight
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Development automatico aun no esta configurado" >> "$GITHUB_STEP_SUMMARY"
            echo "Falta el secret ANTHROPIC_API_KEY. No se investigo nada." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extraer el origen del chat del cuerpo del issue
        id: extraer
        shell: bash
        run: |
          CHAT_ID=$(printf '%s' "${ISSUE_BODY}" | grep -oP '(?<=wobi-chat-id:)-?\d+' | head -1 || true)
          MESSAGE_ID=$(printf '%s' "${ISSUE_BODY}" | grep -oP '(?<=wobi-message-id:)\d+' | head -1 || true)
          echo "chat_id=$CHAT_ID" >> "$GITHUB_OUTPUT"
          echo "message_id=$MESSAGE_ID" >> "$GITHUB_OUTPUT"
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Confirmar al chat que la sesión empezó
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          CHAT_ID: ${{ steps.extraer.outputs.chat_id }}
          MESSAGE_ID: ${{ steps.extraer.outputs.message_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          if [ -z "${ADMIN_SECRET:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::warning::No se pudo confirmar el inicio en WOBI: falta ADMIN_SECRET o wobi-chat-id."
            exit 0
          fi
          BODY=$(jq -n \
            --arg estado "investigando" \
            --argjson chatId "$CHAT_ID" \
            --arg messageId "${MESSAGE_ID:-}" \
            --argjson issueNumero "$ISSUE_NUMBER" \
            --arg issueUrl "$ISSUE_URL" \
            '{estado:$estado,chatId:$chatId,messageId:($messageId | if length > 0 then tonumber else null end),issueNumero:$issueNumero,issueUrl:$issueUrl}')
          curl -sf -X POST "https://copilot.wobagroup.com/webhook/github-autofix-status" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY" || echo "::warning::La sesión empezó, pero WOBI no pudo confirmar el estado en el chat."

      - name: Registrar bloqueo si Claude Code no está configurado
        if: steps.preflight.outputs.configured != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          CHAT_ID: ${{ steps.extraer.outputs.chat_id }}
          MESSAGE_ID: ${{ steps.extraer.outputs.message_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          RESUMEN="Development no pudo iniciar: falta configurar ANTHROPIC_API_KEY en GitHub Actions."
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$RESUMEN"
          if [ -z "${ADMIN_SECRET:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            exit 0
          fi
          BODY=$(jq -n \
            --arg estado "bloqueado" \
            --argjson chatId "$CHAT_ID" \
            --arg messageId "${MESSAGE_ID:-}" \
            --argjson issueNumero "$ISSUE_NUMBER" \
            --arg issueUrl "$ISSUE_URL" \
            --arg resumen "$RESUMEN" \
            '{estado:$estado,chatId:$chatId,messageId:($messageId | if length > 0 then tonumber else null end),issueNumero:$issueNumero,issueUrl:$issueUrl,resumen:$resumen}')
          curl -sf -X POST "https://copilot.wobagroup.com/webhook/github-autofix-status" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY" || true

      - name: Descargar codigo
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-cerebro/package-lock.json

      - name: Preparar dependencias del proyecto
        if: steps.preflight.outputs.configured == 'true'
        run: npm ci

      - name: Investigar y proponer arreglo con Claude Code
        if: steps.preflight.outputs.configured == 'true'
        id: fix
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          label_trigger: "wobi-auto-fix"
          show_full_output: false
          display_report: false
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY:
            ${{ github.event.issue.body }}

            Este issue fue escalado desde el chat de WOBI (un asistente de contabilidad/operaciones
            para varias empresas) por Carlos, su CAO. Investiga a fondo el bug o la mejora descrita,
            trabajando EXCLUSIVAMENTE en el alcance de este issue durante esta sesión aislada; no hagas
            auditorías generales ni cambios laterales no pedidos. El issue es una orden real de ajuste,
            no una solicitud de redactar recomendaciones.
            confirma la causa real LEYENDO el codigo relevante (nunca asumas sin verificar contra el
            codigo real), e implementa un arreglo de RAIZ — nunca un parche superficial ni una
            abstraccion/funcionalidad mas alla de lo que el issue pide. Nunca inventes datos ni
            comportamiento que no puedas confirmar leyendo el repo.

            Las dependencias ya estan instaladas y la rama principal ya paso CI. Empieza por ubicar
            la ruta concreta del comportamiento reportado; no gastes turnos ejecutando la suite
            completa antes de investigar. Despues de implementar, corre primero los tests relevantes
            y luego `npm run typecheck` y `npm run build`. Si el arreglo necesita mas contexto o una
            decision que solo el usuario puede tomar (ej. cambia el comportamiento fiscal/contable
            de forma ambigua), NO lo implementes a ciegas.

            Si lograste un arreglo real, verificado y completo: crea EXACTAMENTE una rama con el
            formato `wobi-autofix/issue-${{ github.event.issue.number }}-<slug-breve>` (solo minusculas,
            numeros, punto, guion o guion bajo en el slug), haz commit y sube esa rama. NO intentes
            abrir el Pull Request: el backend de WOBI lo abrira con privilegio minimo al recibir tu
            resultado. NUNCA fusiones nada ni escribas directamente en la rama principal.

            Si NO lograste un arreglo real y verificado, NO crees ninguna rama ni PR — en vez de eso,
            comenta en el issue (`gh issue comment`) explicando que investigaste y que haria falta para
            seguir.

            Devuelve status="branch_ready" (con branch real y exacta) si subiste el arreglo
            verificado, o status="skipped" (con el motivo en resumen) si no lo hiciste.

            Para no desperdiciar turnos por permisos, ejecuta cada comando Bash por separado y haz
            que empiece directamente por npm, npx, git o gh. No encadenes comandos, no uses cd,
            pipes ni redirecciones.
          claude_args: |
            --model sonnet
            --max-turns 80
            --max-budget-usd 2
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(gh:*)"
            --disallowedTools "WebFetch,WebSearch,Task,Skill"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"status":{"type":"string","enum":["branch_ready","skipped"]},"branch":{"type":"string"},"resumen":{"type":"string","maxLength":600}},"required":["status","resumen"]}'

      - name: Registrar consumo de la sesión
        if: always() && steps.preflight.outputs.configured == 'true'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.fix.outputs.execution_file }}
        run: |
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "### Consumo de Development" >> "$GITHUB_STEP_SUMMARY"
            echo "No estuvo disponible el archivo de ejecución para medir esta sesión." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RESULT=$(jq -s 'map(select(.type == "result")) | last // {}' "$EXECUTION_FILE" 2>/dev/null || echo '{}')
          COST=$(printf '%s' "$RESULT" | jq -r '.total_cost_usd // 0')
          TURNS=$(printf '%s' "$RESULT" | jq -r '.num_turns // 0')
          SUBTYPE=$(printf '%s' "$RESULT" | jq -r '.subtype // "desconocido"')
          echo "### Consumo de Development" >> "$GITHUB_STEP_SUMMARY"
          echo "- Costo API: USD $COST (tope duro: USD 2)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Turnos: $TURNS de 80" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: $SUBTYPE" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar Pull Request seguro con WOBI
        # El chequeo de status="branch_ready" se hace DENTRO del script bash (no aqui con fromJSON) a
        # proposito: si el paso anterior se salto (preflight.configured=false), structured_output
        # queda vacio, y fromJSON('') en una condicion `if:` de YAML podria fallar la evaluacion
        # entera en vez de simplemente evaluar a falso — mas seguro resolverlo con jq, que sí maneja
        # una entrada vacia sin reventar.
        if: steps.preflight.outputs.configured == 'true'
        id: preparar_pr
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.fix.outputs.structured_output }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          CHAT_ID: ${{ steps.extraer.outputs.chat_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          MESSAGE_ID: ${{ steps.extraer.outputs.message_id }}
        run: |
          STATUS=$(printf '%s' "${STRUCTURED_OUTPUT:-}" | jq -r '.status // empty' 2>/dev/null || true)
          if [ "$STATUS" != "branch_ready" ]; then
            echo "No se entrego ninguna rama (status=${STATUS:-vacio}) — nada que publicar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${ADMIN_SECRET:-}" ]; then
            echo "::error::Falta ADMIN_SECRET; la rama existe pero WOBI no puede abrir el PR." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "${CHAT_ID:-}" ]; then
            echo "::error::No se encontro wobi-chat-id; la rama existe pero WOBI no puede entregar la aprobacion." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          BRANCH=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.branch')
          RESUMEN=$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.resumen')
          TITULO_PR="Development: $ISSUE_TITLE"

          BODY=$(jq -n \
            --arg rama "$BRANCH" \
            --arg tituloPR "$TITULO_PR" \
            --arg resumen "$RESUMEN" \
            --argjson chatId "$CHAT_ID" \
            --arg messageId "${MESSAGE_ID:-}" \
            --argjson issueNumero "$ISSUE_NUMBER" \
            '{rama:$rama,tituloPR:$tituloPR,resumen:$resumen,chatId:$chatId,messageId:($messageId | if length > 0 then tonumber else null end),issueNumero:$issueNumero}')

          RESPONSE=$(curl -sf -X POST "https://copilot.wobagroup.com/webhook/github-autofix-branch" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          PR_NUMBER=$(printf '%s' "$RESPONSE" | jq -r '.numeroPR')
          PR_URL=$(printf '%s' "$RESPONSE" | jq -r '.urlPR')
          PR_BRANCH=$(printf '%s' "$RESPONSE" | jq -r '.rama')
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || [ -z "$PR_URL" ] || [ -z "$PR_BRANCH" ]; then
            echo "::error::WOBI no devolvió un Pull Request válido." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"
          echo "resumen_b64=$(printf '%s' "$RESUMEN" | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Esperar sincronización y CI verde
        if: steps.preparar_pr.outputs.pr_number != ''
        id: verificar_ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.preparar_pr.outputs.pr_number }}
        run: |
          for INTENTO in $(seq 1 90); do
            DATA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup,mergeStateStatus)
            MERGE_STATE=$(printf '%s' "$DATA" | jq -r '.mergeStateStatus // "UNKNOWN"')
            TOTAL=$(printf '%s' "$DATA" | jq '[.statusCheckRollup[]?] | length')
            FALLIDOS=$(printf '%s' "$DATA" | jq '[.statusCheckRollup[]? | (.conclusion // .state // "") | select(. == "FAILURE" or . == "ERROR" or . == "CANCELLED" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "STARTUP_FAILURE")] | length')
            PENDIENTES=$(printf '%s' "$DATA" | jq '[.statusCheckRollup[]? | select((.__typename == "CheckRun" and (.status // "") != "COMPLETED") or (.__typename == "StatusContext" and ((.state // "") == "PENDING" or (.state // "") == "EXPECTED")))] | length')

            if [ "$FALLIDOS" -gt 0 ]; then
              echo "::error::El PR #$PR_NUMBER no pasó sus controles; no se mostrarán botones de despliegue." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$TOTAL" -gt 0 ] && [ "$PENDIENTES" -eq 0 ]; then
              if [ "$MERGE_STATE" = "BEHIND" ] || [ "$MERGE_STATE" = "DIRTY" ]; then
                echo "::error::El PR #$PR_NUMBER no quedó sincronizado/fusionable después del CI (estado $MERGE_STATE)." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "PR #$PR_NUMBER sincronizado y con $TOTAL control(es) en verde." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El PR #$PR_NUMBER no terminó sus controles dentro de 15 minutos." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Entregar aprobación a WOBI después del CI
        if: steps.verificar_ci.outcome == 'success'
        id: entregar
        shell: bash
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          CHAT_ID: ${{ steps.extraer.outputs.chat_id }}
          MESSAGE_ID: ${{ steps.extraer.outputs.message_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ steps.preparar_pr.outputs.pr_number }}
          PR_URL: ${{ steps.preparar_pr.outputs.pr_url }}
          PR_BRANCH: ${{ steps.preparar_pr.outputs.branch }}
          RESUMEN_B64: ${{ steps.preparar_pr.outputs.resumen_b64 }}
        run: |
          RESUMEN=$(printf '%s' "$RESUMEN_B64" | base64 --decode)
          BODY=$(jq -n \
            --argjson numeroPR "$PR_NUMBER" \
            --arg rama "$PR_BRANCH" \
            --arg urlPR "$PR_URL" \
            --arg resumen "$RESUMEN" \
            --argjson chatId "$CHAT_ID" \
            --arg messageId "${MESSAGE_ID:-}" \
            --argjson issueNumero "$ISSUE_NUMBER" \
            '{numeroPR:$numeroPR,rama:$rama,urlPR:$urlPR,resumen:$resumen,chatId:$chatId,messageId:($messageId | if length > 0 then tonumber else null end),issueNumero:$issueNumero}')
          curl -sf -X POST "https://copilot.wobagroup.com/webhook/github-autofix" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY"

      - name: Informar si la sesión terminó sin Pull Request
        if: always() && steps.preflight.outputs.configured == 'true'
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.fix.outputs.structured_output }}
          FIX_OUTCOME: ${{ steps.fix.outcome }}
          PREPARE_OUTCOME: ${{ steps.preparar_pr.outcome }}
          VERIFY_OUTCOME: ${{ steps.verificar_ci.outcome }}
          DELIVERY_OUTCOME: ${{ steps.entregar.outcome }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          CHAT_ID: ${{ steps.extraer.outputs.chat_id }}
          MESSAGE_ID: ${{ steps.extraer.outputs.message_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          STATUS=$(printf '%s' "${STRUCTURED_OUTPUT:-}" | jq -r '.status // empty' 2>/dev/null || true)
          if [ "$STATUS" = "branch_ready" ] && [ "$DELIVERY_OUTCOME" = "success" ]; then
            exit 0
          fi

          if [ "$STATUS" = "branch_ready" ] && [ "$PREPARE_OUTCOME" != "success" ]; then
            ESTADO="fallo"
            RESUMEN="Development subió una rama verificada, pero el puente seguro de WOBI no pudo preparar el Pull Request. La rama se conserva para reintentar sin volver a gastar IA."
          elif [ "$STATUS" = "branch_ready" ] && [ "$VERIFY_OUTCOME" != "success" ]; then
            ESTADO="requiere_revision"
            RESUMEN="Development abrió el Pull Request, pero no quedó sincronizado y con CI verde. Por seguridad no se mostraron botones de despliegue."
          elif [ "$STATUS" = "branch_ready" ]; then
            ESTADO="fallo"
            RESUMEN="El Pull Request pasó el CI, pero WOBI no pudo entregar los botones de aprobación."
          elif [ "$FIX_OUTCOME" = "failure" ] || [ "$FIX_OUTCOME" = "cancelled" ]; then
            ESTADO="fallo"
            RESUMEN="La sesión aislada de Development terminó con error antes de proponer un arreglo. Revisa el run de GitHub Actions."
          else
            ESTADO="requiere_revision"
            RESUMEN=$(printf '%s' "${STRUCTURED_OUTPUT:-}" | jq -r '.resumen // "Development investigó, pero no pudo proponer un arreglo verificado."' 2>/dev/null || true)
            [ -n "$RESUMEN" ] || RESUMEN="Development investigó, pero no pudo proponer un arreglo verificado."
          fi

          if [ -z "${ADMIN_SECRET:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::warning::No se pudo avisar el resultado sin PR a WOBI."
            exit 0
          fi
          BODY=$(jq -n \
            --arg estado "$ESTADO" \
            --argjson chatId "$CHAT_ID" \
            --arg messageId "${MESSAGE_ID:-}" \
            --argjson issueNumero "$ISSUE_NUMBER" \
            --arg issueUrl "$ISSUE_URL" \
            --arg resumen "$RESUMEN" \
            '{estado:$estado,chatId:$chatId,messageId:($messageId | if length > 0 then tonumber else null end),issueNumero:$issueNumero,issueUrl:$issueUrl,resumen:$resumen}')
          curl -sf -X POST "https://copilot.wobagroup.com/webhook/github-autofix-status" \
            -H "Authorization: Bearer ${ADMIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY" || echo "::warning::No se pudo entregar el estado final a WOBI."
